name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs that need more declare it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend

  backend-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r backend/requirements-dev.txt
      - run: mypy backend/app --config-file backend/pyproject.toml

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r backend/requirements-dev.txt
      - name: Install gitleaks (used by the integration tests)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - run: cd backend && python -m pytest -q
      - name: Migrations apply cleanly and match the models
        run: |
          cd backend
          export DATABASE_URL=sqlite:///./ci-migration.db
          alembic upgrade head && alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r backend/requirements-dev.txt
      - name: Bandit (backend source)
        run: bandit -r backend/app -c backend/bandit.yaml -ll
      - name: Gitleaks (secret scan, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan (deps, secrets, misconfig)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: npm audit (frontend, high and above)
        run: cd frontend && npm audit --audit-level=high

  container-build-and-scan:
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-types, backend-tests, frontend, security]
    strategy:
      matrix:
        image: [backend, sandbox]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aesa-${{ matrix.image }}:${{ github.sha }} ./${{ matrix.image }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aesa-${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - run: docker save aesa-${{ matrix.image }}:${{ github.sha }} | gzip > ${{ matrix.image }}-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-image
          path: ${{ matrix.image }}-image.tar.gz
          retention-days: 7

  # Human gate: the `production` environment must be configured with REQUIRED REVIEWERS in repo settings.
  # The job below waits for that approval; nothing deploys from an AI request alone.
  deploy:
    runs-on: ubuntu-latest
    needs: [container-build-and-scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
      - name: Deploy (placeholder)
        run: echo "Replace with your real deployment step (push image, apply manifests, ...). Reached only after reviewer approval."
