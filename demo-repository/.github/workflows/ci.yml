name: demo-ci
on:
  push:
    branches: ["agent/proposal-*"]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest ruff mypy bandit
      - run: ruff check .
      - run: mypy app
      - run: bandit -r app -q
      - run: pytest -q
