[project]
name = "aesa-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 190
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "UP037", "UP035", "UP017", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Subprocess use is deliberate, shell-free, and reviewed: argv always comes from the command registry.
"app/sandbox/runner.py" = ["S603", "S607"]
"app/repository/git.py" = ["S603", "S607"]
"tests/*" = ["S", "E501", "E701", "E702"]
"app/agent/scripted.py" = ["E501", "S105"]
"app/agent/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["tests/", "alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
